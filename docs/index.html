<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mini Market Terminal</title>
<style>
:root{--bg:#f2efe6;--panel:#faf8f2;--ink:#1b2430;--mute:#69717c;--line:#d9d4c4;--up:#0b7a47;--dn:#bf2a1f;--acc:#9a5b00;--sel:#ece6d2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1420;--panel:#121b2a;--ink:#d8e0ec;--mute:#7b8aa0;--line:#223048;--up:#38d39a;--dn:#ff6b5e;--acc:#ffb633;--sel:#1a2639}}
:root[data-theme="dark"]{--bg:#0d1420;--panel:#121b2a;--ink:#d8e0ec;--mute:#7b8aa0;--line:#223048;--up:#38d39a;--dn:#ff6b5e;--acc:#ffb633;--sel:#1a2639}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace}
.wrap{max-width:1180px;margin:0 auto;padding:12px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;padding:4px 2px 10px}
h1{font-size:16px;margin:0;color:var(--acc);font-weight:700;letter-spacing:.02em}
.meta{color:var(--mute);font-size:12px}
.badge{border:1px solid var(--acc);color:var(--acc);padding:0 6px;border-radius:3px;margin-right:8px}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:12px}
.strip button{all:unset;cursor:pointer;background:var(--panel);padding:8px 10px;display:block}
.strip button:hover,.strip button.on{background:var(--sel)}
.strip b{display:block;font-weight:600}
.grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:12px}
.panel{background:var(--panel);border:1px solid var(--line)}
.ph{padding:6px 10px;border-bottom:1px solid var(--line);color:var(--mute);font-size:12px;display:flex;justify-content:space-between}
table{width:100%;border-collapse:collapse}
th{font-weight:400;color:var(--mute);font-size:12px;text-align:right;padding:5px 8px;cursor:pointer}
th:first-child,td:first-child{text-align:left}
td{padding:6px 8px;text-align:right;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
tr.row{cursor:pointer}tr.row:hover,tr.row.on{background:var(--sel)}
td.s{font-weight:700}
.up{color:var(--up)}.dn{color:var(--dn)}
svg.sp{width:64px;height:18px;vertical-align:middle}
.big{padding:10px 12px 0;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.big .p{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
#cv{display:block;width:100%;height:260px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
.stats div{padding:8px 12px;border-right:1px solid var(--line)}
.stats div:last-child{border-right:0}
.stats span{display:block;color:var(--mute);font-size:12px}
.term{margin-top:12px}
#log{height:150px;overflow-y:auto;padding:8px 10px;white-space:pre-wrap;color:var(--mute)}
#log .c{color:var(--ink)}#log .e{color:var(--dn)}
.in{display:flex;border-top:1px solid var(--line);align-items:center}
.in label{padding:0 4px 0 10px;color:var(--acc)}
#cmd{flex:1;background:transparent;border:0;color:var(--ink);font:inherit;padding:10px 8px;outline:0}
.in:focus-within{box-shadow:inset 0 0 0 1px var(--acc)}
.scroll{overflow-x:auto}
@media (max-width:820px){.grid{grid-template-columns:1fr}.strip{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.stats div:nth-child(2){border-right:0}.stats div:nth-child(-n+2){border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Mini Market Terminal</h1>
  <div class="meta"><span class="badge">simulated data</span><span id="clock"></span></div>
</header>
<div class="strip" id="strip"></div>
<div class="grid">
  <div class="panel scroll">
    <div class="ph"><span>Watchlist</span><span id="state">live</span></div>
    <table><thead><tr><th data-k="sym">Symbol</th><th data-k="px">Last</th><th data-k="chg">Change</th><th>30s</th></tr></thead><tbody id="wl"></tbody></table>
  </div>
  <div class="panel">
    <div class="ph"><span id="nm"></span><span>hover the chart to inspect</span></div>
    <div class="big"><span class="p" id="bp"></span><span id="bc"></span></div>
    <canvas id="cv"></canvas>
    <div class="stats" id="st"></div>
  </div>
</div>
<div class="panel term">
  <div id="log" aria-live="polite"></div>
  <div class="in"><label for="cmd">&gt;</label><input id="cmd" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type help, or press / to focus"></div>
</div>
</div>
<script>
const $=s=>document.querySelector(s);
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const gauss=r=>Math.sqrt(-2*Math.log(r()||1e-9))*Math.cos(6.2832*r());
const hash=s=>{let h=7;for(const c of s)h=h*31+c.charCodeAt(0)|0;return h};
const N=120;
const S={};let sel='NIFTY',paused=false,sortK=null,hover=-1;
const IDX=[['NIFTY','Nifty 50',24500,.0006],['SENSEX','BSE Sensex',80500,.0006],['SPX','S&P 500',5900,.0005],['NDX','Nasdaq 100',20800,.0007]];
const DEF=[['AAPL','Apple',228,.0012],['MSFT','Microsoft',425,.001],['NVDA','Nvidia',140,.002],['TSLA','Tesla',250,.0025],['RELIANCE','Reliance Industries',2900,.001],['TCS','Tata Consultancy',4100,.0009],['INFY','Infosys',1850,.001],['HDFCBANK','HDFC Bank',1720,.0009]];
function make(sym,name,base,vol,idx){
  const r=rng(hash(sym));let v=1;const raw=[];
  for(let i=0;i<N;i++){v*=1+gauss(r)*vol*1.6;raw.push(v)}
  const k=base/raw[N-1],h=raw.map(x=>x*k);
  S[sym]={sym,name,vol,idx:!!idx,h,open:h[0],v:Math.round(base*1e3*(0.5+r())),prev:base};
}
IDX.forEach(a=>make(a[0],a[1],a[2],a[3],1));
let saved=null;try{saved=JSON.parse(localStorage.getItem('mmt-wl'))}catch(e){}
(saved&&saved.length?saved:DEF).forEach(a=>make(a[0],a[1],a[2],a[3]));
const wl=()=>Object.values(S).filter(s=>!s.idx);
function save(){try{localStorage.setItem('mmt-wl',JSON.stringify(wl().map(s=>[s.sym,s.name,s.h[N-1],s.vol])))}catch(e){}}
const last=s=>s.h[N-1],chg=s=>last(s)/s.open-1;
const f=(x,d=2)=>x.toLocaleString('en-IN',{minimumFractionDigits:d,maximumFractionDigits:d});
const pc=x=>(x>=0?'+':'')+(x*100).toFixed(2)+'%';
const cl=x=>x>=0?'up':'dn';
function spark(s){const a=s.h.slice(-30),mn=Math.min(...a),mx=Math.max(...a)||1,d=mx-mn||1;
  const p=a.map((v,i)=>(i*64/29).toFixed(1)+','+(17-(v-mn)/d*16).toFixed(1)).join(' ');
  return '<svg class="sp" viewBox="0 0 64 18"><polyline fill="none" stroke="currentColor" stroke-width="1.4" points="'+p+'"/></svg>'}
function tick(){
  if(paused)return;
  for(const s of Object.values(S)){s.prev=last(s);const p=last(s)*(1+gauss(Math.random)*s.vol);s.h.push(p);s.h.shift();s.v+=Math.round(Math.random()*400)}
  render();
}
function render(){
  $('#strip').innerHTML=Object.values(S).filter(s=>s.idx).map(s=>'<button data-s="'+s.sym+'" class="'+(s.sym===sel?'on':'')+'"><b>'+s.name+'</b>'+f(last(s))+' <span class="'+cl(chg(s))+'">'+pc(chg(s))+'</span></button>').join('');
  let rows=wl();
  if(sortK)rows=rows.slice().sort((a,b)=>sortK==='sym'?a.sym.localeCompare(b.sym):sortK==='px'?last(b)-last(a):chg(b)-chg(a));
  $('#wl').innerHTML=rows.map(s=>'<tr class="row '+(s.sym===sel?'on':'')+'" data-s="'+s.sym+'"><td class="s">'+s.sym+'</td><td class="'+(last(s)>=s.prev?'up':'dn')+'">'+f(last(s))+'</td><td class="'+cl(chg(s))+'">'+pc(chg(s))+'</td><td class="'+cl(chg(s))+'">'+spark(s)+'</td></tr>').join('')||'<tr><td colspan="4" style="color:var(--mute)">Watchlist is empty. Try: add TSLA</td></tr>';
  panel();draw();
}
function panel(){
  const s=S[sel];if(!s)return;
  const i=hover>=0?hover:N-1,px=s.h[i],c=px/s.open-1;
  $('#nm').textContent=s.sym+' · '+s.name;
  $('#bp').textContent=f(px);
  $('#bc').innerHTML='<span class="'+cl(c)+'">'+pc(c)+'</span>';
  $('#st').innerHTML=[['Open',f(s.open)],['High',f(Math.max(...s.h))],['Low',f(Math.min(...s.h))],['Volume',s.v.toLocaleString('en-IN')]].map(a=>'<div><span>'+a[0]+'</span>'+a[1]+'</div>').join('');
}
function draw(){
  const s=S[sel];if(!s)return;
  const c=$('#cv'),x=c.getContext('2d'),d=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;
  c.width=w*d;c.height=h*d;x.setTransform(d,0,0,d,0,0);
  const css=getComputedStyle(document.documentElement),col=n=>css.getPropertyValue(n).trim();
  const H=s.h,mn=Math.min(...H,s.open),mx=Math.max(...H,s.open),pad=(mx-mn)*.12||1,lo=mn-pad,hi=mx+pad,L=60,B=8,T=8;
  const X=i=>L+i*(w-L-8)/(N-1),Y=v=>T+(hi-v)*(h-T-B)/(hi-lo);
  x.font='11px ui-monospace,Menlo,Consolas,monospace';x.textBaseline='middle';
  for(let k=0;k<=4;k++){const v=lo+(hi-lo)*k/4,y=Y(v);x.strokeStyle=col('--line');x.lineWidth=1;x.beginPath();x.moveTo(L,y);x.lineTo(w,y);x.stroke();x.fillStyle=col('--mute');x.textAlign='right';x.fillText(f(v),L-6,y)}
  const up=last(s)>=s.open,lc=col(up?'--up':'--dn');
  x.setLineDash([4,4]);x.strokeStyle=col('--mute');x.beginPath();x.moveTo(L,Y(s.open));x.lineTo(w,Y(s.open));x.stroke();x.setLineDash([]);
  x.beginPath();H.forEach((v,i)=>i?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v)));
  x.strokeStyle=lc;x.lineWidth=1.8;x.stroke();
  x.lineTo(X(N-1),h-B);x.lineTo(X(0),h-B);x.closePath();x.globalAlpha=.1;x.fillStyle=lc;x.fill();x.globalAlpha=1;
  const hi2=hover>=0?hover:N-1;
  if(hover>=0){x.strokeStyle=col('--mute');x.beginPath();x.moveTo(X(hover),T);x.lineTo(X(hover),h-B);x.stroke()}
  x.fillStyle=lc;x.beginPath();x.arc(X(hi2),Y(H[hi2]),3.5,0,6.29);x.fill();
}
function log(t,k){const l=$('#log'),d=document.createElement('div');if(k)d.className=k;d.textContent=t;l.appendChild(d);while(l.children.length>60)l.removeChild(l.firstChild);l.scrollTop=l.scrollHeight}
const HELP=['Commands:','  add SYM [price]   add a symbol to the watchlist','  rm SYM            remove a symbol','  chart SYM         show a symbol in the chart','  sort sym|px|chg   sort the watchlist (sort off resets)','  pause / resume    stop or restart the live feed','  theme             switch light and dark','  clear             clear this log'].join('\n');
const CMD={
  help(){log(HELP)},
  clear(){$('#log').innerHTML=''},
  add(a){const y=(a[0]||'').toUpperCase();if(!/^[A-Z0-9.&-]{1,12}$/.test(y))return log('Usage: add SYM [price], for example add AMZN 200','e');
    if(S[y])return log(y+' is already on screen. Use chart '+y+' to view it.','e');
    const p=parseFloat(a[1])||50+Math.round(hash(y)%45000)/100;make(y,y+' (simulated)',p,.0015);save();sel=y;render();log('Added '+y+' at '+f(p)+'.')},
  rm(a){const y=(a[0]||'').toUpperCase();if(!S[y]||S[y].idx)return log('Cannot remove '+(y||'that')+'. Use rm SYM for a watchlist symbol.','e');
    delete S[y];if(sel===y)sel='NIFTY';save();render();log('Removed '+y+'.')},
  chart(a){const y=(a[0]||'').toUpperCase();if(!S[y])return log('Unknown symbol '+(y||'')+'. Try add '+(y||'SYM')+' first.','e');sel=y;hover=-1;render();log('Charting '+y+'.')},
  sort(a){const k=(a[0]||'').toLowerCase();if(k==='off')sortK=null;else if(['sym','px','chg'].includes(k))sortK=k;else return log('Usage: sort sym|px|chg|off','e');render();log('Sorted by '+(sortK||'default order')+'.')},
  pause(){paused=true;$('#state').textContent='paused';log('Feed paused.')},
  resume(){paused=false;$('#state').textContent='live';log('Feed resumed.')},
  theme(){const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark';render();log('Theme: '+r.dataset.theme+'.')}
};
const hist=[];let hi=0;
$('#cmd').addEventListener('keydown',e=>{
  const i=e.target;
  if(e.key==='Enter'){const t=i.value.trim();i.value='';if(!t)return;hist.push(t);hi=hist.length;log('> '+t,'c');
    const [c,...a]=t.split(/\s+/),fn=CMD[c.toLowerCase()];fn?fn(a):log('Unknown command "'+c+'". Type help for the list.','e')}
  else if(e.key==='ArrowUp'&&hi>0){hi--;i.value=hist[hi];e.preventDefault()}
  else if(e.key==='ArrowDown'){hi=Math.min(hi+1,hist.length);i.value=hist[hi]||'';e.preventDefault()}
});
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==$('#cmd')){e.preventDefault();$('#cmd').focus()}});
document.addEventListener('click',e=>{const t=e.target.closest('[data-s]');if(t){sel=t.dataset.s;hover=-1;render()}
  const th=e.target.closest('th[data-k]');if(th){sortK=th.dataset.k;render()}});
const cv=$('#cv');
cv.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect(),L=60;hover=Math.max(0,Math.min(N-1,Math.round((e.clientX-r.left-L)/(r.width-L-8)*(N-1))));panel();draw()});
cv.addEventListener('mouseleave',()=>{hover=-1;panel();draw()});
addEventListener('resize',draw);
const clk=()=>{$('#clock').textContent=new Date().toLocaleTimeString('en-IN',{hour12:false})+' local'};
setInterval(clk,1000);clk();
setInterval(tick,1000);
log('Prices are simulated with a random walk, not real market data.\nType help to see commands. Click a row to chart it.');
render();
</script>
</body>
</html>
